<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 排版编辑器</title><link rel="stylesheet" href="/runtime/site.css"><link rel="stylesheet" href="/editor/editor.css"></head><body>
<header class="editor-header"><a href="/editor/" class="editor-logo">f/o <span>STUDIO</span></a><span id="save-status" role="status">正在载入…</span><div class="header-actions"><button id="undo" title="撤销 Ctrl+Z" disabled>↶</button><button id="redo" title="重做 Ctrl+Shift+Z" disabled>↷</button><span class="divider"></span><button id="settings-open">个人资料</button><button id="import-open">导入项目</button><button id="export-open">导出 ▾</button><button id="preview" class="primary">预览 ↗</button></div></header>
<div class="editor-body"><aside class="left-panel"><section class="panel-section"><div class="panel-title"><h2>页面</h2><button id="new-page" aria-label="新建页面">＋</button></div><div id="page-list"></div></section><section class="asset-section"><div class="panel-title"><h2>素材库</h2><button id="upload" aria-label="上传素材">↑ 上传</button></div><input id="asset-upload" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif,video/mp4" multiple hidden><input id="asset-search" placeholder="搜索素材" aria-label="搜索素材"><p class="small-note">点击添加 · 所有页面共用<br>透明图片 / GIF / MP4</p><div id="asset-list"></div></section></aside>
<main class="workspace"><div class="workspace-toolbar"><div class="segmented"><button id="desktop" class="active">桌面</button><button id="mobile">手机</button></div><div class="segmented language"><button id="zh" class="active">中</button><button id="en">EN</button></div><span class="divider"></span><button id="add-text">＋ 文字</button><button id="add-shape">＋ 色块</button><label class="canvas-background">背景<input id="canvas-background" type="color" value="#ffffff" aria-label="画布背景颜色"></label><div class="zoom-controls"><button id="zoom-out" aria-label="缩小画布">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大画布">＋</button><button id="fit">适合画布</button></div></div><div id="lock-banner" hidden><span>另一窗口正在编辑此页 · 这里实时同步查看</span><button id="takeover">接管编辑</button></div><div id="canvas-scroll"><div class="canvas-wrapper" id="canvas-wrapper"><div id="canvas"></div><button id="height-handle" title="向下拖动增加画布长度" aria-label="调整画布长度">↕ 拖动调整画布长度</button></div></div><div class="workspace-footer"><span id="page-caption"></span><span>拖动移动 · 四角缩放 · 顶部旋转 · 双击文字编辑</span></div></main>
<aside class="right-panel"><section class="inspector"><div class="panel-title"><h2>所选元素</h2><button id="delete-element" title="删除元素" disabled>⌫</button></div><div id="empty-selection">在画布上选择一个元素<br><span>素材原件始终保留在素材库中</span></div><div id="element-inspector" hidden><input id="element-name" aria-label="图层名称" placeholder="图层名称"><div id="text-tools" hidden><label>文字内容<textarea id="text-content" rows="3" placeholder="编辑当前语言的文字"></textarea></label><div class="compact-row"><select id="font-family" aria-label="字体"><option value="Arial">简洁无衬线</option><option value="Microsoft YaHei">微软雅黑</option><option value="Georgia">衬线字体</option></select><input id="text-color" type="color" aria-label="文字颜色"></div><label class="range-label">字号<input id="font-size" type="range" min="10" max="120" value="28"><span id="font-value">28</span></label><div class="compact-row"><button id="bold">粗体</button><button id="align">居中</button></div></div><div id="shape-tools" hidden><label>填充<input id="shape-color" type="color" aria-label="色块颜色"></label><label class="range-label">圆角<input id="shape-radius" type="range" min="0" max="100"></label></div><div id="media-tools" hidden><label>替换素材<select id="replace-asset"></select></label><label>图片显示<select id="image-fit"><option value="contain">完整展示</option><option value="cover">填满裁切</option></select></label></div><label>预设互动<select id="effect"><option value="none">无</option><option value="hover">悬停放大</option><option value="appear">滚动出现</option><option value="cursor">图形光标</option><option value="draggable">访客可拖动</option><option value="collage">拼贴动态</option><option value="demo">演示轮播</option></select></label><label>点击后<select id="link"><option value="">无操作</option></select></label><input id="external-link" placeholder="https://…" aria-label="外部网址" hidden><button id="reset-rotation" class="subtle">恢复旋转</button></div></section><section class="layers-section"><div class="panel-title"><h2>图层</h2><span class="small-note">上方位于前景</span></div><p class="small-note">拖动排序 · 眼睛控制当前视图</p><div id="layer-list"></div></section></aside></div>
<dialog id="page-dialog" class="editor-dialog"><form id="page-form"><h2 id="page-dialog-title">新建页面</h2><label>中文名称<input name="zh" required maxlength="100" autofocus></label><label>英文名称<input name="en" maxlength="100" placeholder="可稍后修改"></label><div class="dialog-actions"><button type="button" data-close="page-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="settings-dialog" class="editor-dialog"><form id="settings-form"><h2>个人资料与联系</h2><label>中文署名<input name="nameZh" required></label><label>英文署名<input name="nameEn"></label><label>邮箱<input name="email" type="email"></label><label>微信号<input name="wechatId"></label><label>微信二维码素材<select name="wechatQr" id="settings-qr"></select></label><p class="small-note">简介及首页文字可直接在画布中编辑。</p><div class="dialog-actions"><button type="button" data-close="settings-dialog">取消</button><button class="primary" type="submit">保存资料</button></div></form></dialog>
<dialog id="import-dialog" class="editor-dialog"><h2>导入完整项目</h2><p>导入将替换当前页面和素材库。本地会先保存一份当前项目备份。</p><input id="project-import" type="file" accept=".json"><p id="import-summary" class="small-note">选择 .folio.json 项目文件</p><div class="dialog-actions"><button data-close="import-dialog">取消</button><button id="import-confirm" class="primary" disabled>确认导入</button></div></dialog>
<dialog id="export-dialog" class="editor-dialog"><h2>导出</h2><button id="export-project" class="export-option"><strong>完整项目备份 ↗</strong><span>所有页面、两套布局及原素材 · 可继续编辑</span></button><button id="export-site" class="export-option"><strong>可发布网站 ZIP ↗</strong><span>包含页面、图片、视频及互动 · 解压后可浏览</span></button><div class="dialog-actions"><button data-close="export-dialog">关闭</button></div></dialog>
<div id="editor-toast" role="status" hidden></div><script src="/runtime/render.js"></script><script src="/editor/editor.js"></script></body></html>
